<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
</head>
<body>
    <div>
        <header>
            <div>
                <img src="./images/icon.svg" alt="Logo"/>
                <h2>회원가입하기</h2>
            </div>
            <a><img src="./images/out.svg" alt="뒤로가기"></a>
        </header>
        <form name="signup" method="post">
            <section>
                <span>이름</span>
                <input name="firstname" type="text" placeholder="김사자" required autocomplete="off"/>
            </section>
            <section>
                <span>아이디</span>
                <input name="username" type="text" placeholder="아이디를 입력해주세요" required autocomplete="off"/>                
            </section>
            <section>
                <span>비밀번호</span>
                <input name="password" type="password1" placeholder="비밀번호를 입력해주세요" required autocomplete="new-password"/>
            </section>
            <section>
                <span>비밀번호 확인</span>
                <input name="password" type="password2" placeholder="비밀번호를 다시 확인해주세요" required autocomplete="new-password"/>
            </section>
            <button type="submit">회원가입하기</button>
        </form>
    </div>
</body>
</html>
