{% extends 'base.html' %}
{% block title %}댓글 수정{% endblock %}

{% block content %}
<h1>댓글 수정</h1>
<form 
    action="{% url 'posts:comment-update' comment.post.id comment.id %}"
    method="POST"
>
    {% csrf_token %}
    <div>{{ form.as_p }}</div>
    <div>
        <input type="submit" value="수정 완료">
        <a href="{% url 'posts:post-detail' comment.post.id %}">취소</a>
    </div>
</form>
{% endblock %}
