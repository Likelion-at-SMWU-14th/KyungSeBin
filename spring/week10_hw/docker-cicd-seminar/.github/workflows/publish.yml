name: Publish image to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: spring/week10_hw/docker-cicd-seminar

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seminar
          POSTGRES_PASSWORD: seminar-local
          POSTGRES_DB: seminar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seminar -d seminar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://seminar:seminar-local@localhost:5432/seminar

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: spring/week10_hw/docker-cicd-seminar/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests with coverage
        run: python -m pytest -q --cov=main --cov-report=term-missing --cov-fail-under=80

  publish:
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./spring/week10_hw/docker-cicd-seminar
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}